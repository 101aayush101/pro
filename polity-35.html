<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polity 35 | CGL Arena</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#132c53;color:white;padding:16px 22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.wrap{max-width:1160px;margin:24px auto;padding:0 16px}.layout{display:grid;grid-template-columns:1fr 260px;gap:18px}.panel{background:white;border:1px solid #e1e6ee;border-radius:16px;padding:24px;box-shadow:0 4px 16px #142d5310}.muted{color:#60718b}.option{display:block;padding:14px;border:1px solid #d9e2ef;border-radius:10px;margin:10px 0;cursor:pointer}.option:has(input:checked){border-color:#2863cc;background:#eaf1ff}.option input{margin-right:12px}button{background:#1d55b1;color:white;border:0;border-radius:9px;padding:12px 16px;cursor:pointer;font-weight:650}button.secondary{background:#e9eff9;color:#193d75}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.nav button{padding:9px 0;background:#e7ebf2;color:#273c59}.nav button.answered{background:#d7f4e6;color:#17633e}.nav button.current{outline:3px solid #3265d2}.nav button.marked{box-shadow:inset 0 0 0 2px #d6a12b}.result{padding:14px;background:#eaf1ff;border-radius:10px;margin-bottom:16px}.explain{padding:12px;border-radius:10px;background:#f0f5fb;margin-top:12px}.correct{color:#11733d}.wrong{color:#bd3838}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:17px}.top{padding:14px}} </style></head><body><div class="top"><div><b>CGL Arena • Polity Revision Mock</b><div style="font-size:13px;opacity:.8">35 questions · Moderate · +2 / −0.5</div></div><strong id="timer">20:00</strong></div><main class="wrap"><div class="layout"><section class="panel"><div id="status" class="muted"></div><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><div class="actions" id="actions"><button class="secondary" onclick="prev()">Previous</button><button class="secondary" onclick="mark()">Mark for review</button><button class="secondary" onclick="clearAnswer()">Clear response</button><button onclick="next()">Save & Next</button></div></section><aside class="panel"><h3>Question palette</h3><div class="muted" id="progress"></div><div id="nav" class="nav" style="margin:15px 0"></div><button id="submit" onclick="submitTest()">Submit test</button><p class="muted" style="font-size:13px">Unattempted questions receive 0. Results show explanations for every question.</p></aside></div></main><script>
const qs=[["Which Article defines 'State' for Fundamental Rights?",["12","13","36","14"],0,"Article 12 defines State for Part III; Article 36 defines it for Part IV."],["Equality of opportunity in public employment is guaranteed by",["Article 14","Article 15","Article 16","Article 17"],2,"Article 16 governs equality of opportunity in public employment."],["Who may prescribe a residence requirement for certain public employment under Article 16(3)?",["State Governor","Parliament","State Public Service Commission","President alone"],1,"Parliament may legislate residence requirements under Article 16(3)."],["Which protection is NOT covered by Article 20?",["Ex post facto criminal laws","Double jeopardy","Self-incrimination","Right to free education"],3,"Education is Article 21A."],["Article 21A covers free and compulsory education for ages",["3–6","6–14","6–18","0–14"],1,"Article 21A covers children aged six to fourteen."],["Which is prohibited by Article 23?",["Religious instruction in all schools","Traffic in human beings and forced labour","Titles of nobility only","Child labour in every occupation"],1,"Article 23 prohibits trafficking and forced labour."],["Which Article gives the Supreme Court jurisdiction to enforce Fundamental Rights through writs?",["32","226","136","143"],0,"Article 32; High Courts exercise writ powers under Article 226."],["During a National Emergency, enforcement of which rights cannot be suspended under Article 359?",["Articles 14 and 19","Articles 20 and 21","Articles 25 and 26","Articles 29 and 30"],1,"Article 359 excludes Articles 20 and 21."],["Right to property is currently protected under",["Article 19(1)(f)","Article 31","Article 300A","Article 32"],2,"Article 300A is a constitutional right, not a Fundamental Right."],["Which DPSP concerns equal justice and free legal aid?",["38","39A","40","44"],1,"Article 39A."],["Article 45 currently concerns",["Compulsory education to age 14","Early childhood care and education below age 6","Uniform Civil Code","Adult literacy"],1,"Article 45 addresses early childhood care and education for children below six."],["Which provision addresses separation of judiciary from executive in public services?",["Article 48A","Article 50","Article 51","Article 39A"],1,"Article 50."],["Fundamental Duties were inserted by the",["44th Amendment","42nd Amendment","52nd Amendment","86th Amendment"],1,"42nd Amendment, 1976."],["Which Article concerns election of the President?",["52","54","56","61"],1,"Article 54."],["Who participates in the Vice-President's election?",["Elected MLAs and MPs","Only elected Lok Sabha MPs","Members of both Houses of Parliament, including nominated MPs","Only elected Rajya Sabha MPs"],2,"Members of both Houses of Parliament, including nominated MPs."],["The Vice-President is ex officio Chairman of",["Lok Sabha","Rajya Sabha","NITI Aayog","Finance Commission"],1,"Article 64."],["The President's impeachment is provided under",["Article 56","Article 61","Article 72","Article 74"],1,"Article 61."],["Which Article covers the President's pardoning powers?",["72","74","161","123"],0,"Article 72; Governor's pardoning power is Article 161."],["The Council of Ministers is collectively responsible to",["President","Rajya Sabha","Lok Sabha","Both Houses equally"],2,"Article 75(3): Lok Sabha."],["Parliament of India consists of",["Only Lok Sabha and Rajya Sabha","President, Lok Sabha and Rajya Sabha","President and Lok Sabha only","Prime Minister and two Houses"],1,"Article 79."],["The composition of Rajya Sabha is addressed by",["Article 79","Article 80","Article 81","Article 83"],1,"Article 80."],["Who certifies a Money Bill?",["President","Rajya Sabha Chairman","Lok Sabha Speaker","Finance Minister"],2,"The Speaker's decision on whether a Bill is a Money Bill is final under Article 110(3)."],["The Rajya Sabha must return a Money Bill within",["7 days","14 days","30 days","6 weeks"],1,"Fourteen days."],["A joint sitting of Parliament is provided under",["Article 100","Article 108","Article 110","Article 123"],1,"Article 108; not used for Money Bills or Constitutional Amendment Bills."],["President's ordinance-making power is under",["Article 111","Article 123","Article 213","Article 356"],1,"Article 123."],["The Supreme Court is established under",["Article 124","Article 127","Article 136","Article 143"],0,"Article 124."],["Appointment of ad hoc judges to the Supreme Court is governed by",["Article 126","Article 127","Article 129","Article 141"],1,"Article 127."],["The Supreme Court's Special Leave to Appeal jurisdiction comes from",["Article 132","Article 136","Article 141","Article 142"],1,"Article 136."],["The Election Commission of India derives constitutional authority from",["Article 280","Article 315","Article 324","Article 338"],2,"Article 324."],["The Finance Commission is constituted under",["Article 148","Article 263","Article 280","Article 315"],2,"Article 280."],["Which amendment reduced voting age from 21 to 18?",["42nd","44th","61st","73rd"],2,"61st Constitutional Amendment."],["The Tenth Schedule primarily deals with",["Panchayats","Anti-defection","Languages","Municipalities"],1,"Tenth Schedule: anti-defection."],["Which Schedule contains the 29 subjects of Panchayats?",["Sixth","Seventh","Eleventh","Twelfth"],2,"Eleventh Schedule: 29 Panchayat subjects."],["Parliament's residuary legislative powers are under",["Article 246","Article 248","Article 249","Article 250"],1,"Article 248."],["The Inter-State Council is provided for by",["Article 254","Article 262","Article 263","Article 280"],2,"Article 263."]];let idx=0,answers=Array(qs.length).fill(null),marked=new Set(),finished=false,remaining=1200;const $=id=>document.getElementById(id);const saved=localStorage.getItem("polity35-v1");if(saved){try{const s=JSON.parse(saved);if(s.answers?.length===35){answers=s.answers;remaining=s.remaining;marked=new Set(s.marked||[]);finished=!!s.finished}}catch(e){}}
function persist(){localStorage.setItem("polity35-v1",JSON.stringify({answers,remaining,marked:[...marked],finished}))}
function render(){let q=qs[idx];$("status").textContent="Question "+(idx+1)+" of 35"+(marked.has(idx)?" • Marked for review":"");$("question").textContent=q[0];$("options").innerHTML=q[1].map((o,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(answers[idx]===j?'checked':'')+' '+(finished?'disabled':'')+' onchange="choose('+j+')">'+String.fromCharCode(65+j)+'. '+o+'</label>').join("");$("feedback").innerHTML=finished?'<div class="explain"><b class="'+(answers[idx]===q[2]?'correct':'wrong')+'">Correct answer: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</b><p>'+q[3]+'</p></div>':'';$("nav").innerHTML=qs.map((_,i)=>'<button class="'+(answers[i]!==null?'answered ':'')+(idx===i?'current ':'')+(marked.has(i)?'marked':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join("");$("progress").textContent=answers.filter(x=>x!==null).length+" answered • "+marked.size+" marked";$("actions").style.display=finished?'none':'flex';$("submit").style.display=finished?'none':'inline-block';if(finished){let c=answers.filter((x,i)=>x===qs[i][2]).length,w=answers.filter((x,i)=>x!==null&&x!==qs[i][2]).length;$("status").textContent="Test completed";$("feedback").innerHTML='<div class="result"><h2>Score: '+(c*2-w*.5)+' / 70</h2><p>'+c+' correct · '+w+' incorrect · '+(35-c-w)+' skipped</p><button onclick="resetTest()">Retake test</button></div>'+$("feedback").innerHTML}}
function choose(j){answers[idx]=j;persist();render()}function go(i){idx=i;render()}function next(){idx=Math.min(34,idx+1);persist();render()}function prev(){idx=Math.max(0,idx-1);render()}function mark(){marked.has(idx)?marked.delete(idx):marked.add(idx);persist();render()}function clearAnswer(){answers[idx]=null;persist();render()}function submitTest(){if(!confirm("Submit your test now?"))return;finished=true;persist();render()}function resetTest(){if(!confirm("Start a fresh attempt?"))return;answers=Array(35).fill(null);marked.clear();idx=0;remaining=1200;finished=false;persist();render()}function tick(){let m=Math.floor(remaining/60),s=remaining%60;$("timer").textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(!finished){if(remaining<=0){finished=true;persist();render()}else{remaining--;if(remaining%5===0)persist()}}}render();tick();setInterval(tick,1000);
</script></body></html>
